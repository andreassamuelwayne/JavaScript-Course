<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Calculator</title>
</head>

<body>

    <h1>Personal Calculator</h1>

    <input id="numberInput" type="number" placeholder="First number">
    <input id="numberInput2" type="number" placeholder="Second number">

    <button id="addButton">Add</button>
    <button id="subtractButton">Subtract</button>
    <button id="multiplyButton">Multiply</button>
    <button id="divideButton">Divide</button>
    <button id="calculateButton">Calculate</button>

    <p id="result">Result will appear here:</p>

    <script src="main.js"></script>

</body>
</html>
